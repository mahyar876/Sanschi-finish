name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:assistant && npm run test:gallery-filters
        working-directory: backend

  backend-integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/sanschii_ci
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long
      NODE_ENV: development
      ALLOW_MOCK_PAY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: node seed.js
        working-directory: backend
      - run: node server.js &
        working-directory: backend
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/health | grep -q '"db":true'; then exit 0; fi
            sleep 2
          done
          echo "API did not become ready"
          exit 1
      - run: npm run test:flow-smoke -- http://127.0.0.1:5000
        working-directory: backend
      - run: npm run test:concurrent-booking -- http://127.0.0.1:5000
        working-directory: backend
      - run: node scripts/security-smoke-test.js http://127.0.0.1:5000
        working-directory: backend

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install chromium
        working-directory: web
      - run: npm run start &
        working-directory: web
        env:
          PORT: '3000'
      - name: Wait for web
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm run test:e2e
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
